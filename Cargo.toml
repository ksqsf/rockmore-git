[package]
name = "rockmore-git"
version = "0.1.0"
authors = ["ksqsf <i@ksqsf.moe>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "git-mount"
path = "bin/git-mount.rs"

[dependencies]
fuser = "0.16"
# We only need local repository access; disabling default git2 features
# avoids pulling SSH/HTTPS stacks with additional vulnerable transitive deps.
git2 = { version = "0.21", default-features = false }
log = "0.4"
# Keep env_logger lean to avoid unmaintained optional transitive proc-macro deps.
env_logger = { version = "0.11", default-features = false }
libc = "0.2.186"
openat = "0.1"
